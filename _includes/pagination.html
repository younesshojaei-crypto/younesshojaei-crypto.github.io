<div class="container">
  <nav class="pagination" role="navigation" aria-label="Pagination">
    <ul>
      {% if paginator.previous_page %}
        <p>
          <a class="newer-posts" href="{% if paginator.previous_page == 1 %}{{ site.baseurl }}/{% else %}{{ site.baseurl }}/page/{{ paginator.previous_page }}/{% endif %}">
            صفحه قبلی <i class="fa fa-long-arrow-right" aria-hidden="true"></i>
          </a>
        </p>
      {% endif %}

      {% if paginator.total_pages > 1 %}
        <p><span class="page-number">صفحه {{ paginator.page }} از {{ paginator.total_pages }}</span></p>
      {% endif %}
      
      {% if paginator.next_page %}
        <p>
          <a class="older-posts" href="{{ site.baseurl }}/page/{{ paginator.next_page }}/">
            <i class="fa fa-long-arrow-left" aria-hidden="true"></i> صفحه بعدی
          </a>
        </p>
      {% endif %}
    </ul>
  </nav>
</div>

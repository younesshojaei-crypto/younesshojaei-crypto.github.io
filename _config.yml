# Site
name: 'نویز | NOYS'
description: 'روایت‌های داستانی از کسب‌ و کارهای سایه و بیزینس‌های ممنوعه'
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.ico'
baseurl: ""
disqus: ''
email: 'younesshojaei@gmail.com'
mailchimp-list: ''

include: ["_pages"]
permalink: /:title/

# Plugins
plugins: 
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag

authors:
    youness:
      name:           یونس شجاعی
      site:           https://younesshojaei-crypto.github.io
      avatar:         /assets/images/avatar1.jpg
      bio:            "روایت‌های داستانی از کسب‌ و کارهای سایه و بیزینس‌های ممنوعه"
      email:          younesshojaei@gmail.com
      twitter:        https://twitter.com/younesshojaei

# Defaults
defaults:

  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      author: youness
      avatar: /assets/images/avatar1.jpg
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page
      
# Syntax
markdown: kramdown
highlighter: rouge

# Paginate
paginate: 10

# Exclude metadata and development time dependencies (like Grunt plugins)
exclude: [README.markdown, package.json, grunt.js, Gruntfile.js, Gruntfile.coffee, node_modules]

---
layout: main
---
<article class="article-page">
  <div class="page-content">
    {% if page.img %}
    <div class="page-cover-image">
      <figure>
        <img class="page-image" src="{{ page.img | prepend: '/assets/img/' | relative_url }}" alt="{{ page.title }}">
        {% if page.fig-caption %}
          <figcaption>{{ page.fig-caption }}</figcaption>
        {% endif %}
      </figure>
    </div>
    {% endif %}
    
    <div class="wrap-content">
      <header class="header-page">
        <h1 class="page-title">{{ page.title }}</h1>
        <div class="page-date"><span>{{ page.date | date: '%Y/%m/%d' }}</span></div>
      </header>
      
      <div class="post-markdown-body">
        {{ content }}
      </div>

      <div class="page-footer">
        <div class="page-share">
          <span>اشتراک‌گذاری:</span>
          <a href="https://twitter.com/intent/tweet?text={{ page.title }}&url={{ site.url }}{{ site.baseurl }}{{ page.url }}" title="توییتر" rel="nofollow" target="_blank"><i class="fa fa-twitter"></i></a>
          <a href="https://telegram.me/share/url?url={{ site.url }}{{ site.baseurl }}{{ page.url }}&text={{ page.title }}" title="تلگرام" rel="nofollow" target="_blank"><i class="fa fa-paper-plane"></i></a>
        </div>
        <div class="page-tag">
          {% for tag in page.tags %}
            <a href="{{ site.baseurl }}/tags#{{ tag }}" class="tag">&#35; {{ tag }}</a>
          {% endfor %}
        </div>
      </div>
      {% include disqus.html %}
    </div>
  </div>
</article>

<style>
  .article-page {
    max-width: 840px;
    margin: 0 auto;
    width: 100%;
  }

  .page-cover-image img {
    width: 100%;
    border-radius: 8px;
  }

  .page-cover-image figcaption {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-top: 8px;
  }

  .header-page {
    margin-bottom: 25px;
    border-bottom: 1px solid #eef2f8;
    padding-bottom: 15px;
  }

  .page-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 10px;
    color: #222;
  }

  .page-date {
    color: #888;
    font-size: 14px;
  }

  .post-markdown-body {
    font-size: 17px;
    line-height: 1.9;
    color: #333;
  }

  /* Responsive 16:9 YouTube Video Container */
  .video-container {
    position: relative;
    padding-bottom: 56.25%; /* 16:9 ratio */
    height: 0;
    overflow: hidden;
    max-width: 100%;
    background: #000;
    border-radius: 8px;
    margin: 25px 0;
  }
  .video-container iframe,
  .video-container object,
  .video-container embed {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* Podcast Player Container (Castbox / Spotify / etc.) */
  .podcast-container {
    width: 100%;
    margin: 25px 0;
    border-radius: 8px;
    overflow: hidden;
    background: #fdfdfd;
  }
  .podcast-container iframe {
    width: 100%;
    border: none;
  }

  .post-markdown-body ul, 
  .post-markdown-body ol {
    padding-right: 25px !important;
    padding-left: 0 !important;
    margin-bottom: 20px !important;
    direction: rtl !important;
  }
  .post-markdown-body li {
    margin-bottom: 8px !important;
    text-align: right !important;
  }

  .page-footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #eef2f8;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
  }

  .page-share {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .page-share a {
    color: #555;
    font-size: 18px;
    transition: color 0.2s;
  }
  .page-share a:hover {
    color: #263959;
  }

  .page-tag .tag {
    background: #f0f4f8;
    padding: 4px 10px;
    border-radius: 4px;
    text-decoration: none;
    color: #555;
    font-size: 13px;
  }
</style>

```html
---
layout: main
---

<article class="article-page">

  <div class="page-content">

    {% if page.img %}
    <div class="page-cover-image">
      <figure>
        <img
          class="page-image"
          src="{{ page.img | prepend: '/assets/img/' | relative_url }}"
          alt="{{ page.title }}"
        >

        {% if page.fig-caption %}
        <figcaption>
          {{ page.fig-caption }}
        </figcaption>
        {% endif %}
      </figure>
    </div>
    {% endif %}


    <div class="wrap-content">

      <header class="header-page">

        <h1 class="page-title">
          {{ page.title }}
        </h1>

        <div class="page-date">
          <span>
            {{ page.date | date: '%Y/%m/%d' }}
          </span>
        </div>

      </header>


      <div class="post-markdown-body">
        {{ content }}
      </div>


      <div class="page-footer">

        <div class="page-share">

          <span>
            اشتراک‌گذاری:
          </span>

          <a
            href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ site.url }}{{ site.baseurl }}{{ page.url }}"
            title="توییتر"
            rel="nofollow"
            target="_blank"
          >
            <i class="fa fa-twitter"></i>
          </a>

          <a
            href="https://telegram.me/share/url?url={{ site.url }}{{ site.baseurl }}{{ page.url }}&text={{ page.title | url_encode }}"
            title="تلگرام"
            rel="nofollow"
            target="_blank"
          >
            <i class="fa fa-paper-plane"></i>
          </a>

        </div>


        <div class="page-tag">

          {% for tag in page.tags %}

          <a
            href="{{ site.baseurl }}/tags#{{ tag }}"
            class="tag"
          >
            &#35; {{ tag }}
          </a>

          {% endfor %}

        </div>

      </div>


      {% include disqus.html %}

    </div>

  </div>

</article>
```

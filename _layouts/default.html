<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>{{ page.title | default: site.name }}</title>
  <meta name="description" content="{{ site.description }}" />
  
  <!-- Vazirmatn Font -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  <link rel="icon" href="{{ site.favicon }}" type="image/x-icon" />
</head>
<body class="is-preload">

  <div id="wrapper" class="fade-in">

    <!-- Header / Branding -->
    <header id="header">
      <a href="{{ '/' | relative_url }}" class="logo">
        <img src="{{ site.logo }}" alt="{{ site.name }}" class="site-avatar" />
        <span>{{ site.name }}</span>
      </a>
    </header>

    <!-- Navigation Bar -->
    <nav id="nav">
      <ul class="links">
        <li class="active"><a href="{{ '/' | relative_url }}">صفحه اصلی</a></li>
        <li><a href="{{ site.social.youtube }}" target="_blank">یوتیوب</a></li>
        <li><a href="{{ site.social.castbox }}" target="_blank">کست‌باکس</a></li>
        <li><a href="{{ site.social.substack }}" target="_blank">ساب‌استک</a></li>
      </ul>
      <ul class="icons">
        <li><a href="{{ site.social.youtube }}" target="_blank" class="icon brands fa-youtube"><span class="label">YouTube</span></a></li>
        <li><a href="{{ site.social.castbox }}" target="_blank" class="icon solid fa-podcast"><span class="label">Castbox</span></a></li>
        <li><a href="{{ site.social.instagram }}" target="_blank" class="icon brands fa-instagram"><span class="label">Instagram</span></a></li>
        <li><a href="{{ site.social.substack }}" target="_blank" class="icon solid fa-envelope-open-text"><span class="label">Substack</span></a></li>
      </ul>
    </nav>

    <!-- Main Content Area -->
    <div id="main">
      {{ content }}
    </div>

    <!-- Footer -->
    <footer id="footer">
      <section class="split contact">
        <section class="alt">
          <h3>درباره نویز</h3>
          <p>{{ site.description }}</p>
        </section>
        <section>
          <h3>ایمیل ارتباطی</h3>
          <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
        </section>
      </section>
    </footer>

  </div>

</body>
</html>
